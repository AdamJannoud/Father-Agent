# Recipe A (the default): the Father Agent's Telegram bot on Render's FREE web
# service, kept awake by a pinger. One click:
#   https://render.com/deploy?repo=https://github.com/AdamJannoud/Father-Agent
# (or Render → New → Blueprint → this repository). The sync:false values below
# are typed into Render's own form at creation, never into a chat or a commit.
#
# Why a web service and not a worker: Render has no free background worker, and
# a free web service spins down after 15 minutes without INBOUND traffic. A
# polling bot only makes outbound calls, so point a free pinger (UptimeRobot,
# cron-job.org) at https://<service>.onrender.com/healthz every 10 minutes.
# /healthz answers 200 only while the poll loop is alive, so the pinger doubles
# as an alert. One always-on service fits the 750 free hours a month; the disk
# is wiped on every restart, which is why each bundle is delivered as a ZIP.
#
# The genuinely 24/7 upgrade (no sleep, no pinger, $7/month) is
# deploy/render-worker.yaml. Secrets are entered in the dashboard (sync: false),
# never committed.
services:
  - type: web
    name: father-agent-bot
    runtime: python
    plan: free
    region: frankfurt
    # Two pip steps, because the two files pin different pydantics. The
    # --only-binary list is what stops pip falling back to building aiohttp's C
    # stack from an sdist: a wheel that is missing now fails the build loudly
    # instead of compiling with an incompatible toolchain. .python-version
    # (3.12) selects the interpreter. CI runs this exact line
    # (scripts/run_render_build.py), so it cannot drift.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install --only-binary=aiohttp,multidict,yarl,frozenlist,aiosignal,propcache -r requirements-bot.txt
    startCommand: python main.py bot
    healthCheckPath: /healthz
    # off: a later push to this public repository cannot redeploy your bot behind
    # your back. Flip it to On Commit in the dashboard when you want that.
    autoDeployTrigger: "off"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Gemini first, then Groq and Hugging Face as fallbacks. Gemini's free tier
      # allows 20 requests per day per project per model: measured 2026-10-09,
      # Google answered HTTP 429 RESOURCE_EXHAUSTED with quotaId
      # GenerateRequestsPerDayPerProjectPerModel-FreeTier. A 429 is retried
      # (honouring RetryInfo/Retry-After), then falls through to the next one.
      # build_chain (father_agent/providers/chain.py) keeps only the providers
      # Config.has_key() reports as keyed, so a fallback named here with no key
      # is skipped silently. That is why GROQ_API_KEY and HF_TOKEN are
      # deliberately not in this form: add either free key in the dashboard
      # later and it joins the chain, no config edit. With no key at all the
      # factory runs on the offline mock provider.
      - key: FATHER_PROVIDER_ORDER
        value: gemini,groq,huggingface
      - key: FATHER_LOG_LEVEL
        value: INFO
